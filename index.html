<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1016" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sudoku" />
  <title>Sudoku</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon.svg" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div class="app">
    <section class="view active" data-view="home">
      <div class="brand">
        <div class="logo-mark"><img src="./icons/icon.svg" alt="Sudoku" /></div>
        <h1>Sudoku</h1>
        <p>Unique puzzles. Smart notes. Your times.</p>
      </div>
      <div class="home-actions">
        <button class="btn primary" id="continueBtn">Resume</button>
        <p class="resume-meta" id="resumeMeta"></p>
        <button class="btn" id="newGameBtn">New Game</button>
        <button class="btn" id="statsBtn">Statistics</button>
        <p class="install-hint">On iPhone or iPad: tap Share, then Add to Home Screen.<br />The timer pauses when you leave the app.</p>
      </div>
    </section>
    <section class="view" data-view="difficulty">
      <div class="screen-title">
        <button class="icon-btn" id="backFromDiff" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
        <h2>Difficulty</h2>
      </div>
      <div class="diff-list" id="diffList"></div>
      <div class="gen-status" id="genStatus"></div>
    </section>
    <section class="view" data-view="stats">
      <div class="screen-title">
        <button class="icon-btn" id="backFromStats" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
        <h2>Statistics</h2>
      </div>
      <div class="stats-list" id="statsList"></div>
      <div class="reset-row"><button class="btn" id="resetStats">Reset times</button></div>
    </section>
    <section class="view" data-view="game">
      <div class="game-top">
        <button class="icon-btn" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <div class="timer-wrap"><span class="diff-pill" id="diffPill">Easy</span><div class="timer" id="timer">0:00</div></div>
        <button class="icon-btn" id="pauseBtn" aria-label="Pause"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
      </div>
      <div class="board-wrap"><div class="board" id="board"></div></div>
      <div class="controls">
        <div class="tools">
          <button class="tool" id="noteBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>Notes</button>
          <button class="tool" id="allNotesBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>All notes</button>
          <button class="tool" id="singlesBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 8v8M8 12h8"/></svg>Singles</button>
          <button class="tool" id="teachBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19a8 8 0 1 1 16 0"/><path d="M12 11v.01"/><path d="M9 8a3 3 0 1 1 4.5 2.6c-.8.5-1.5 1.2-1.5 2.4"/></svg>Teach</button>
          <button class="tool" id="eraseBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 21h14"/><path d="M16.5 3.5l4 4L8 20H4v-4L16.5 3.5z"/></svg>Erase</button>
          <button class="tool" id="undoBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14l-4-4 4-4"/><path d="M5 10h9a6 6 0 1 1 0 12h-3"/></svg>Undo</button>
        </div>
        <div class="nums">
          <button class="num" data-n="1">1<span class="left">9</span></button>
          <button class="num" data-n="2">2<span class="left">9</span></button>
          <button class="num" data-n="3">3<span class="left">9</span></button>
          <button class="num" data-n="4">4<span class="left">9</span></button>
          <button class="num" data-n="5">5<span class="left">9</span></button>
          <button class="num" data-n="6">6<span class="left">9</span></button>
          <button class="num" data-n="7">7<span class="left">9</span></button>
          <button class="num" data-n="8">8<span class="left">9</span></button>
          <button class="num" data-n="9">9<span class="left">9</span></button>
        </div>
      </div>
      <div class="teach-sheet" id="teachSheet">
        <div class="teach-kicker" id="teachKicker">Next number</div>
        <h3 id="teachTitle">Look here</h3>
        <p id="teachBody"></p>
        <button class="btn primary" id="teachGotIt">Place it</button>
        <button class="btn ghost" id="teachDismiss">Just explain</button>
      </div>
      <div class="overlay" id="pauseOverlay">
        <h3>Paused</h3>
        <p>The board is hidden so the timer stays honest.</p>
        <button class="btn primary" id="resumeBtn">Resume</button>
      </div>
      <div class="overlay" id="winOverlay">
        <h3>Solved</h3>
        <p id="winSub">Nice work</p>
        <div class="big-time" id="winTime">0:00</div>
        <button class="btn primary" id="winNew">New Game</button>
        <button class="btn ghost" id="winHome">Home</button>
      </div>
    </section>
  </div>
  <script src="./js/app.js"></script>
</body>
</html>
